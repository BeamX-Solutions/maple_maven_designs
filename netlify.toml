[build]
     command = "npm run build"
     functions = "netlify/functions"
     publish = "dist"

   [build.environment]
     # Vite 7 requires Node ^20.19.0 || >=22.12.0
     NODE_VERSION = "22"

   [[redirects]]
     from = "/api/*"
     to = "/.netlify/functions/:splat"
     status = 200

   [[redirects]]
     from = "/*"
     to = "/index.html"
     status = 200